<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>dBm signal strength scale, closer to 0 is stronger</title>
<rect width="680" height="300" fill="#ffffff"/>
<text x="60" y="35" font-family="Arial" font-size="16" fill="#2C2C2A" font-weight="bold">Closer to 0 = stronger signal</text>

<rect x="220" y="55" width="380" height="30" rx="4" fill="#97C459"/>
<text x="60" y="75" font-family="Arial" font-size="15" fill="#2C2C2A">-30 dBm</text>
<text x="60" y="95" font-family="Arial" font-size="13" fill="#5F5E5A">very strong</text>

<rect x="220" y="105" width="320" height="30" rx="4" fill="#97C459"/>
<text x="60" y="125" font-family="Arial" font-size="15" fill="#2C2C2A">-50 dBm</text>
<text x="60" y="145" font-family="Arial" font-size="13" fill="#5F5E5A">great</text>

<rect x="220" y="155" width="240" height="30" rx="4" fill="#EF9F27"/>
<text x="60" y="175" font-family="Arial" font-size="15" fill="#2C2C2A">-67 dBm</text>
<text x="60" y="195" font-family="Arial" font-size="13" fill="#5F5E5A">voice/video guideline</text>

<rect x="220" y="205" width="160" height="30" rx="4" fill="#F09595"/>
<text x="60" y="225" font-family="Arial" font-size="15" fill="#2C2C2A">-80 dBm</text>
<text x="60" y="245" font-family="Arial" font-size="13" fill="#5F5E5A">weak, drops likely</text>

<rect x="220" y="255" width="80" height="30" rx="4" fill="#F09595"/>
<text x="60" y="275" font-family="Arial" font-size="15" fill="#2C2C2A">-90 dBm</text>
<text x="60" y="290" font-family="Arial" font-size="13" fill="#5F5E5A">almost no signal</text>
</svg>
