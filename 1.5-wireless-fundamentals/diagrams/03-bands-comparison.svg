<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Wi-Fi bands compared by range and speed</title>
<rect width="680" height="280" fill="#ffffff"/>
<text x="60" y="30" font-family="Arial" font-size="14" fill="#5F5E5A">Teal bar = range. Purple bar = speed.</text>

<text x="60" y="80" font-family="Arial" font-size="16" fill="#2C2C2A" font-weight="bold">2.4 GHz</text>
<text x="60" y="100" font-family="Arial" font-size="13" fill="#5F5E5A">most crowded</text>
<rect x="220" y="62" width="380" height="20" rx="4" fill="#1D9E75"/>
<rect x="220" y="90" width="150" height="20" rx="4" fill="#7F77DD"/>

<text x="60" y="150" font-family="Arial" font-size="16" fill="#2C2C2A" font-weight="bold">5 GHz</text>
<text x="60" y="170" font-family="Arial" font-size="13" fill="#5F5E5A">less crowded</text>
<rect x="220" y="132" width="250" height="20" rx="4" fill="#1D9E75"/>
<rect x="220" y="160" width="270" height="20" rx="4" fill="#7F77DD"/>

<text x="60" y="220" font-family="Arial" font-size="16" fill="#2C2C2A" font-weight="bold">6 GHz</text>
<text x="60" y="240" font-family="Arial" font-size="13" fill="#5F5E5A">newest, emptiest</text>
<rect x="220" y="202" width="170" height="20" rx="4" fill="#1D9E75"/>
<rect x="220" y="230" width="380" height="20" rx="4" fill="#7F77DD"/>
</svg>
