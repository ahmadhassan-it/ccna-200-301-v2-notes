<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Hassan-Lab topology: wireless router with two laptops and a PC</title>
<rect width="680" height="340" fill="#ffffff"/>

<rect x="250" y="30" width="180" height="70" rx="8" fill="#97C459"/>
<text x="340" y="58" font-family="Arial" font-size="15" fill="#173404" text-anchor="middle">Wireless router</text>
<text x="340" y="78" font-family="Arial" font-size="12" fill="#27500A" text-anchor="middle">SSID: Hassan-Lab, ch 11</text>
<text x="340" y="94" font-family="Arial" font-size="12" fill="#27500A" text-anchor="middle">WPA2-Personal, AES</text>

<rect x="60" y="230" width="140" height="56" rx="8" fill="#85B7EB"/>
<text x="130" y="264" font-family="Arial" font-size="14" fill="#042C53" text-anchor="middle">Laptop1</text>

<rect x="270" y="230" width="140" height="56" rx="8" fill="#85B7EB"/>
<text x="340" y="264" font-family="Arial" font-size="14" fill="#042C53" text-anchor="middle">Laptop2</text>

<rect x="480" y="230" width="140" height="56" rx="8" fill="#85B7EB"/>
<text x="550" y="264" font-family="Arial" font-size="14" fill="#042C53" text-anchor="middle">PC1</text>

<line x1="300" y1="100" x2="150" y2="228" stroke="#378ADD" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="340" y1="100" x2="340" y2="228" stroke="#378ADD" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="380" y1="100" x2="530" y2="228" stroke="#378ADD" stroke-width="2" stroke-dasharray="6 5"/>

<text x="340" y="320" font-family="Arial" font-size="13" fill="#5F5E5A" text-anchor="middle">Dashed lines = wireless (Wi-Fi)</text>
</svg>
