<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Wi-Fi security from WEP to WPA3</title>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="60" y="20" width="110" height="50" rx="8" fill="#F09595"/>
<text x="115" y="50" font-family="Arial" font-size="16" fill="#501313" text-anchor="middle">WEP</text>
<text x="200" y="40" font-family="Arial" font-size="14" fill="#2C2C2A">RC4 encryption</text>
<text x="200" y="58" font-family="Arial" font-size="12" fill="#5F5E5A">broken, never use</text>
<line x1="115" y1="72" x2="115" y2="90" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="60" y="92" width="110" height="50" rx="8" fill="#FAC775"/>
<text x="115" y="122" font-family="Arial" font-size="16" fill="#412402" text-anchor="middle">WPA</text>
<text x="200" y="112" font-family="Arial" font-size="14" fill="#2C2C2A">TKIP encryption</text>
<text x="200" y="130" font-family="Arial" font-size="12" fill="#5F5E5A">old, avoid</text>
<line x1="115" y1="144" x2="115" y2="162" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="60" y="164" width="110" height="50" rx="8" fill="#97C459"/>
<text x="115" y="194" font-family="Arial" font-size="16" fill="#173404" text-anchor="middle">WPA2</text>
<text x="200" y="184" font-family="Arial" font-size="14" fill="#2C2C2A">AES-CCMP encryption</text>
<text x="200" y="202" font-family="Arial" font-size="12" fill="#5F5E5A">still very common</text>
<line x1="115" y1="216" x2="115" y2="234" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="60" y="236" width="110" height="50" rx="8" fill="#5DCAA5"/>
<text x="115" y="266" font-family="Arial" font-size="16" fill="#04342C" text-anchor="middle">WPA3</text>
<text x="200" y="256" font-family="Arial" font-size="14" fill="#2C2C2A">SAE handshake</text>
<text x="200" y="274" font-family="Arial" font-size="12" fill="#5F5E5A">newest, best choice</text>
</svg>
