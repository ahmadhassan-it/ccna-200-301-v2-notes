<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>2.4 GHz channel overlap, use channels 1, 6, 11</title>
<rect width="680" height="260" fill="#ffffff"/>
<text x="60" y="35" font-family="Arial" font-size="16" fill="#2C2C2A" font-weight="bold">2.4 GHz: use 1, 6 and 11</text>

<path d="M60 190 Q140 60 220 190" fill="none" stroke="#378ADD" stroke-width="3"/>
<path d="M260 190 Q340 60 420 190" fill="none" stroke="#1D9E75" stroke-width="3"/>
<path d="M460 190 Q540 60 620 190" fill="none" stroke="#D85A30" stroke-width="3"/>
<path d="M140 190 Q220 60 300 190" fill="none" stroke="#E24B4A" stroke-width="2" stroke-dasharray="6 5"/>

<line x1="60" y1="190" x2="620" y2="190" stroke="#888780" stroke-width="1"/>
<text x="140" y="215" font-family="Arial" font-size="15" fill="#2C2C2A" text-anchor="middle">1</text>
<text x="340" y="215" font-family="Arial" font-size="15" fill="#2C2C2A" text-anchor="middle">6</text>
<text x="540" y="215" font-family="Arial" font-size="15" fill="#2C2C2A" text-anchor="middle">11</text>
<text x="220" y="100" font-family="Arial" font-size="13" fill="#791F1F" text-anchor="middle">3 (bad, overlaps 1 and 6)</text>
</svg>
