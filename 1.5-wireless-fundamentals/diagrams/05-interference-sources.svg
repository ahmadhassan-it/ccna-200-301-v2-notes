<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sources of interference on a Wi-Fi link</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="300" fill="#ffffff"/>

<rect x="60" y="50" width="140" height="56" rx="8" fill="#97C459"/>
<text x="130" y="84" font-family="Arial" font-size="15" fill="#173404" text-anchor="middle">AP</text>

<rect x="480" y="50" width="140" height="56" rx="8" fill="#85B7EB"/>
<text x="550" y="84" font-family="Arial" font-size="15" fill="#042C53" text-anchor="middle">Phone</text>

<line x1="200" y1="78" x2="478" y2="78" stroke="#378ADD" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="60" y="190" width="160" height="70" rx="8" fill="#FAC775"/>
<text x="140" y="220" font-family="Arial" font-size="14" fill="#412402" text-anchor="middle">Microwave oven</text>
<text x="140" y="242" font-family="Arial" font-size="12" fill="#633806" text-anchor="middle">2.4 GHz noise</text>

<rect x="260" y="190" width="160" height="70" rx="8" fill="#FAC775"/>
<text x="340" y="220" font-family="Arial" font-size="14" fill="#412402" text-anchor="middle">Bluetooth</text>
<text x="340" y="242" font-family="Arial" font-size="12" fill="#633806" text-anchor="middle">2.4 GHz noise</text>

<rect x="460" y="190" width="160" height="70" rx="8" fill="#FAC775"/>
<text x="540" y="220" font-family="Arial" font-size="14" fill="#412402" text-anchor="middle">Other AP</text>
<text x="540" y="242" font-family="Arial" font-size="12" fill="#633806" text-anchor="middle">same channel</text>

<line x1="140" y1="188" x2="190" y2="108" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="340" y1="188" x2="260" y2="108" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="540" y1="188" x2="300" y2="108" stroke="#E24B4A" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
