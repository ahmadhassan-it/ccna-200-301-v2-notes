<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Parts of a radio wave</title>
<rect width="680" height="260" fill="#ffffff"/>
<path d="M60 150 Q110 70 160 150 T260 150 T360 150 T460 150 T560 150" fill="none" stroke="#378ADD" stroke-width="3"/>
<line x1="90" y1="60" x2="90" y2="140" stroke="#D85A30" stroke-width="1.5"/>
<text x="100" y="95" font-family="Arial" font-size="15" fill="#712B13">Amplitude = height = signal strength</text>
<line x1="60" y1="152" x2="60" y2="195" stroke="#888780" stroke-width="1"/>
<line x1="160" y1="152" x2="160" y2="195" stroke="#888780" stroke-width="1"/>
<line x1="63" y1="190" x2="157" y2="190" stroke="#1D9E75" stroke-width="2"/>
<text x="60" y="215" font-family="Arial" font-size="15" fill="#085041">Wavelength = length of one full wave</text>
<text x="60" y="245" font-family="Arial" font-size="15" fill="#2C2C2A">Frequency = how many full waves pass per second (1 Hz = 1 wave/sec)</text>
</svg>
