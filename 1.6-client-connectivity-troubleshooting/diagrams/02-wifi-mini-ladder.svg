<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">WiFi mini ladder (lives inside step 1 of the main ladder)</text>
  <g font-size="13">
    <rect x="60" y="46" width="560" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="68" font-weight="bold" fill="#1e3a8a">4  Got an IP address?</text>
    <text x="76" y="90" fill="#1f2937">Fails: DHCP or VLAN problem (169.254.x.x)</text>
    <rect x="60" y="112" width="560" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="134" font-weight="bold" fill="#1e3a8a">3  Joined the network?  (netsh wlan show interfaces: State connected)</text>
    <text x="76" y="156" fill="#1f2937">Fails: security mismatch (WPA3-only vs WPA2-only device), MAC filter</text>
    <rect x="60" y="178" width="560" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="200" font-weight="bold" fill="#1e3a8a">2  Password or login accepted?</text>
    <text x="76" y="222" fill="#1f2937">Fails: wrong password, old saved password, wrong enterprise login</text>
    <rect x="60" y="244" width="560" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="266" font-weight="bold" fill="#1e3a8a">1  Can I SEE the SSID?</text>
    <text x="76" y="288" fill="#1f2937">Fails: out of range, wrong band (2.4 / 5 GHz), hidden SSID</text>
  </g>
  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#9a3412">Connected but slow or dropping? Check the Signal % first.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
