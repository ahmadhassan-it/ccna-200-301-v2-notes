<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="680" height="460" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">The troubleshooting ladder (L-I-G-P-N): work from the bottom up</text>
  <g font-size="13">
    <rect x="60" y="48" width="560" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="70" font-weight="bold" fill="#1e3a8a">5  NAME works?   ping www.test.com / nslookup</text>
    <text x="76" y="92" fill="#1f2937">If it fails: DNS problem (wrong or dead DNS server)</text>

    <rect x="60" y="124" width="560" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="146" font-weight="bold" fill="#1e3a8a">4  PUBLIC IP works?   ping 8.8.8.8</text>
    <text x="76" y="168" fill="#1f2937">If it fails: router uplink or ISP problem (past the gateway)</text>

    <rect x="60" y="200" width="560" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="222" font-weight="bold" fill="#1e3a8a">3  GATEWAY works?   ping (gateway IP)</text>
    <text x="76" y="244" fill="#1f2937">If it fails: wrong mask / gateway / network, wrong VLAN, gateway down</text>

    <rect x="60" y="276" width="560" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="298" font-weight="bold" fill="#1e3a8a">2  good IP?   ipconfig  (ip addr on Linux)</text>
    <text x="76" y="320" fill="#1f2937">If it fails: DHCP did not answer (169.254.x.x) or wrong static IP</text>

    <rect x="60" y="352" width="560" height="66" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="76" y="374" font-weight="bold" fill="#1e3a8a">1  LINK up?   cable light / WiFi / show interfaces status</text>
    <text x="76" y="396" fill="#1f2937">If it fails: cable, switch port shut down, WiFi password or security, weak signal</text>
  </g>
  <rect x="20" y="430" width="640" height="24" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="340" y="447" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="bold">Rule: stop at the LOWEST rung that is broken. Fix it, then test again.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
