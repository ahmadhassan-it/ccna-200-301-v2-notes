<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="680" height="270" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Three "off" states on a switch port (show interfaces status)</text>
  <g font-size="12">
    <rect x="20" y="48" width="205" height="170" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="122" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">notconnect</text>
    <text x="122" y="98" text-anchor="middle" fill="#1f2937">Who turned it off?</text>
    <text x="122" y="116" text-anchor="middle" fill="#1f2937">Nobody</text>
    <text x="122" y="144" text-anchor="middle" fill="#1f2937">Cause: no link found</text>
    <text x="122" y="162" text-anchor="middle" fill="#1f2937">(cable out, device off)</text>
    <text x="122" y="196" text-anchor="middle" fill="#854d0e">Fix: check cable and device</text>

    <rect x="237" y="48" width="205" height="170" rx="8" fill="#ffedd5" stroke="#ea580c"/>
    <text x="340" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">disabled</text>
    <text x="340" y="98" text-anchor="middle" fill="#1f2937">Who turned it off?</text>
    <text x="340" y="116" text-anchor="middle" fill="#1f2937">A person: shutdown</text>
    <text x="340" y="144" text-anchor="middle" fill="#1f2937">Cause: shutdown typed</text>
    <text x="340" y="162" text-anchor="middle" fill="#1f2937">on the port</text>
    <text x="340" y="196" text-anchor="middle" fill="#9a3412">Fix: no shutdown (interface mode)</text>

    <rect x="454" y="48" width="205" height="170" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="556" y="72" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">err-disabled</text>
    <text x="556" y="98" text-anchor="middle" fill="#1f2937">Who turned it off?</text>
    <text x="556" y="116" text-anchor="middle" fill="#1f2937">The switch itself</text>
    <text x="556" y="144" text-anchor="middle" fill="#1f2937">Cause: a rule break or error</text>
    <text x="556" y="162" text-anchor="middle" fill="#1f2937">(for example port security)</text>
    <text x="556" y="190" text-anchor="middle" fill="#991b1b">Fix the cause first, then</text>
    <text x="556" y="206" text-anchor="middle" fill="#991b1b">shutdown + no shutdown</text>
  </g>
  <text x="340" y="250" text-anchor="middle" font-size="12" fill="#374151">In all three the link is DOWN. A green light does not prove VLAN or duplex are right.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
