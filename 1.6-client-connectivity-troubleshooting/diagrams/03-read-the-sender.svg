<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="680" height="330" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker></defs>
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">Rule: the device named in the reply is the device that gave up</text>

  <text x="20" y="62" font-size="13" font-weight="bold" fill="#1f2937">Case 1: Reply from 192.168.1.25: Destination host unreachable</text>
  <rect x="40" y="76" width="110" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="95" y="96" text-anchor="middle" font-size="12" fill="#1e3a8a">PC 192.168.1.25</text>
  <text x="95" y="112" text-anchor="middle" font-size="11" fill="#1e3a8a">(sender = itself)</text>
  <line x1="150" y1="99" x2="300" y2="99" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="225" y="92" text-anchor="middle" font-size="12" fill="#dc2626">no answer (ARP)</text>
  <rect x="300" y="76" width="130" height="46" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="365" y="104" text-anchor="middle" font-size="12" fill="#991b1b">target 192.168.1.50</text>
  <text x="450" y="104" font-size="12" fill="#1f2937">= the PC gave up (local problem)</text>

  <text x="20" y="170" font-size="13" font-weight="bold" fill="#1f2937">Case 2: Reply from 192.168.1.1: Destination host unreachable</text>
  <rect x="40" y="184" width="110" height="46" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="95" y="212" text-anchor="middle" font-size="12" fill="#1e3a8a">PC</text>
  <line x1="150" y1="207" x2="240" y2="207" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="240" y="184" width="130" height="46" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="305" y="204" text-anchor="middle" font-size="12" fill="#166534">Router 192.168.1.1</text>
  <text x="305" y="220" text-anchor="middle" font-size="11" fill="#166534">(sender = router)</text>
  <line x1="370" y1="207" x2="450" y2="207" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="460" y="212" font-size="12" fill="#1f2937">= the router gave up (path problem)</text>

  <rect x="20" y="258" width="640" height="56" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="340" y="282" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="bold">"Request timed out" names NO device. Nobody answered, nobody explained.</text>
  <text x="340" y="302" text-anchor="middle" font-size="13" fill="#9a3412">Read ipconfig and the other pings to find the reason.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
